name: Update Boys Sports Calendars

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright beautifulsoup4

      - name: Install Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Update Boys Sports calendars
        run: |
          success=0

          for attempt in 1 2 3
          do
            echo "============================================================"
            echo "CALENDAR UPDATE ATTEMPT $attempt/3"
            echo "============================================================"

            if xvfb-run -a python update_all_calendars.py
            then
              echo ""
              echo "Calendar update succeeded on attempt $attempt."
              success=1
              break
            fi

            echo ""
            echo "Calendar update failed on attempt $attempt."

            if [ "$attempt" -lt 3 ]
            then
              echo "Waiting 60 seconds before starting a completely fresh attempt..."
              sleep 60
            fi
          done

          if [ "$success" -ne 1 ]
          then
            echo ""
            echo "============================================================"
            echo "ALL 3 CALENDAR UPDATE ATTEMPTS FAILED"
            echo "============================================================"
            exit 1
          fi

      - name: Show generated calendars
        run: |
          echo "Generated calendar files:"
          ls -lh *.ics

          echo ""
          echo "Event counts:"

          echo -n "U14s LRGS Rugby: "
          grep -c "^BEGIN:VEVENT" u14s-lrgs-rugby.ics || true

          echo -n "U12 Bluestars:   "
          grep -c "^BEGIN:VEVENT" u12-bluestars.ics || true

          echo -n "U9 Bluestars:    "
          grep -c "^BEGIN:VEVENT" u9-bluestars.ics || true

          echo -n "Combined:        "
          grep -c "^BEGIN:VEVENT" calendar.ics || true

      - name: Commit updated calendars
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add calendar.ics

          git add -f \
            u14s-lrgs-rugby.ics \
            u12-bluestars.ics \
            u9-bluestars.ics

          if git diff --cached --quiet; then
            echo "No calendar changes."
          else
            git commit -m "Update Boys Sports calendars"
            git push
          fi